<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>To-Do</h1>
      <button id="theme-toggle" aria-label="Toggle dark mode">Dark</button>
    </div>

    <form id="add-form">
      <input
        id="task-input"
        type="text"
        placeholder="What needs doing?"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <div class="filter-bar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Active</button>
        <button class="filter-tab" data-filter="completed">Completed</button>
      </div>
      <input id="search-input" type="search" placeholder="Search tasks…" autocomplete="off">
    </div>

    <ul id="task-list"></ul>

    <p id="empty-msg" class="empty">No tasks yet — add one above.</p>

    <footer class="stats" id="stats"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
